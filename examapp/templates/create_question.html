{% extends "base.html" %}
{% block title %}Add question{% endblock %}
{% block content %}
<header class="page-head"><div><h1>Add question</h1><p class="sub">For {{ test.title }}</p></div></header>
<form class="card form-card" method="post" novalidate>
  {% csrf_token %}
  {% include "_form_fields.html" %}
  <div class="form-actions"><button class="btn btn-primary" type="submit">Add question</button><a class="btn" href="{% url 'TeacherTestDetail' test.id %}">Cancel</a></div>
</form>
{% endblock %}
