{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block shell %}
<div class="login-wrap">
  <div class="login-side">
    <span class="brand" style="padding:0">ExamFlow</span>
    <div>
      <h1>Tests that run themselves.</h1>
      <p>Teachers set the paper. Students sit it on their own time. Marks are ready the moment it is submitted.</p>
    </div>
    <span></span>
  </div>
  <div class="login-main">
    <div class="login-box">
      <h2>Log in</h2>
      {% include "_messages.html" %}
      <form method="post">
        {% csrf_token %}
        <div class="field"><label for="username">Username</label><input id="username" name="username" type="text" autocomplete="username" required autofocus></div>
        <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
        <button class="btn btn-primary" type="submit" style="width:100%">Log in</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
