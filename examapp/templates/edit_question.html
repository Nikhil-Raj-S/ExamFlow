{% extends "base.html" %}
{% block title %}Edit question{% endblock %}
{% block content %}
<header class="page-head"><div><h1>Edit question</h1><p class="sub">For {{ question.test.title }}</p></div></header>
<form class="card form-card" method="post" novalidate>
  {% csrf_token %}
  {% include "_form_fields.html" %}
  <div class="form-actions"><button class="btn btn-primary" type="submit">Save changes</button><a class="btn" href="{% url 'TeacherTestDetail' question.test.id %}">Cancel</a></div>
</form>
{% endblock %}
