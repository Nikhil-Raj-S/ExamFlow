<form class="filters" method="get">
  <input type="search" name="search" value="{{ request.GET.search }}" placeholder="Search by title" aria-label="Search by title">
  <input type="text" name="subject" value="{{ request.GET.subject }}" placeholder="Subject" aria-label="Subject">
  <button class="btn btn-primary" type="submit">Filter</button>
  {% if request.GET.search or request.GET.subject %}<a class="btn" href="{{ request.path }}">Clear</a>{% endif %}
</form>
